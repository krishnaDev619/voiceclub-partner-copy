allprojects {
    repositories {
        maven {
            url "https://artifact.byteplus.com/repository/public/"
        }
        google()
        mavenCentral()
        maven { url 'https://s3.ap-south-1.amazonaws.com/hvsdk/android/releases' }
    }
}

rootProject.buildDir = '../build'

subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}

// Added this because all_sensors package was having a older version in which namespace was not defined in manifest.
subprojects {
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    namespace project.group
                }
            }
        }
    }
}

subprojects {
    project.evaluationDependsOn(':app')
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}